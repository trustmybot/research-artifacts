<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How a Reviewer Works and Where Reviews Went Shallow or Failed</title>
<desc id="d">Four steps from left to right: 1. Input (issue text and patch commit), 2. Thinking (may think before acting), 3. Tools and Tests (reads code, runs commands), 4. Strictly Decoded Verdict (pass, fail or no verdict). Counts at low / medium / high effort: No Thinking at step 2: Opus 5.5 (preregistered) 18 / 1 / 0, Sonnet 5.5 (exploratory) 5 / 4 / 0, Haiku 5.5 (exploratory) 0 / 0 / 0; At Most One Tool Call at step 3: Opus 5.5 (preregistered) 12 / 0 / 0, Sonnet 5.5 (exploratory) 22 / 16 / 1, Haiku 5.5 (exploratory) 1 / 0 / 0; No Test Run at step 3: Opus 5.5 (preregistered) 23 / 3 / 1, Sonnet 5.5 (exploratory) 34 / 28 / 7, Haiku 5.5 (exploratory) 9 / 2 / 1; Malformed Verdict at step 4: Opus 5.5 (preregistered) 0 / 0 / 0, Sonnet 5.5 (exploratory) 2 / 5 / 3, Haiku 5.5 (exploratory) 0 / 3 / 2. No review hit the $4 cost cap or the 60-minute timeout.</desc>
